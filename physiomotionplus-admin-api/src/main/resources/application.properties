spring.application.name=physiomotionplus-admin-api
firebase.project-id=physiomotionplusapp-admin
firestore.project-id=physiomotionplusdb
firestore.database-id=${FIRESTORE_DATABASE_ID:(default)}
firestore.startup-check.enabled=true
firestore.startup-check.timeout-seconds=10
firestore.startup-check.fail-fast=true
server.port=${PORT:8081}
videos.bucket=${VIDEO_BUCKET:physiomotionplus-videos-dev}
videos.allowed-admin-uids=${VIDEO_ALLOWED_ADMIN_UIDS:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4201,https://physiomotionplusapp-admin-dev.web.app,https://physiomotionplusapp-admin.web.app,https://physiomotionplusapp-admin.firebaseapp.com}
spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=250MB
